# Runtime agent definition (draft schema). Executed on pi by services/runtime.
id: gate-reviewer
version: 0.1.0
phase: migrate
description: Review a member's PR against its task pack, architecture rules and AS-IS behavior; post findings and the gate checklist.
model:
  provider: anthropic
  id: claude-sonnet-5-5
  thinking: high
skills: []                   # TODO: pr-gate-review skill
tools:
  allow: [read, grep, find, ls, kb.search, task.get, pr.comment, gate.report]
network: default             # kintsugi-app + egress-proxy (LLM hosts) only
inputs: [pull-request, kb-query]
outputs:
  - pr-comment               # on the member's PR in the code repo
  - path: reviews/{workItem}/{pr}.md
    commit: auto
triggers:
  - event: pr.opened
  - event: pr.synchronized
budget:
  max_cost_usd: 2
  timeout_sec: 900
review:
  approver_role: core-team   # the agent never approves; a human does (gate G4)
