# Kintsugi — self-hosted package (ADR-0006).
# Usage: cp .env.example .env && docker compose up -d
name: kintsugi

services:
  app:
    image: ${KINTSUGI_REGISTRY:-ghcr.io/evoelsewhere}/kintsugi-app:${KINTSUGI_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kintsugi:${POSTGRES_PASSWORD}@postgres:5432/kintsugi
      KINTSUGI_DATA_DIR: /var/lib/kintsugi     # the API reads the document repo mirrors (read-only)
      KINTSUGI_PORTAL_DIR: /app/apps/portal/dist
      PORT: 3000
    ports:
      - "${KINTSUGI_HTTP_PORT:-8080}:3000"   # put the project's reverse proxy / TLS in front
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 60s
    volumes:
      - kintsugi-data:/var/lib/kintsugi:ro   # API reads the worker's Git mirrors (ADR-0025)
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  # Runs Git sync, the document repo writer and runtime jobs in job workspaces under
  # /var/lib/kintsugi/jobs (ADR-0029: no Docker socket, no per-job container, no OS sandbox).
  # The image provides git 2.40+, Python 3.12 and Node 22 (standard libraries only) and runs
  # as a non-root user; memory and CPU limits here bound all jobs of this worker together.
  worker:
    image: ${KINTSUGI_REGISTRY:-ghcr.io/evoelsewhere}/kintsugi-worker:${KINTSUGI_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kintsugi:${POSTGRES_PASSWORD}@postgres:5432/kintsugi
      KINTSUGI_DATA_DIR: /var/lib/kintsugi
    volumes:
      - kintsugi-data:/var/lib/kintsugi             # git mirrors, document repo worktrees, job workspaces (ADR-0025, ADR-0029)
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]                          # outbound: Git servers and the configured LLM providers

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kintsugi
      POSTGRES_USER: kintsugi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kintsugi"]
      interval: 5s
      retries: 20
    networks: [backend]

networks:
  backend: {}

volumes:
  pg-data: {}
  # Backed by the admin-chosen host directory (ADR-0025).
  kintsugi-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${KINTSUGI_DATA_DIR:?set KINTSUGI_DATA_DIR in .env}
