# Kintsugi — self-hosted package (ADR-0006). DRAFT: images are not built yet.
# Usage: cp .env.example .env && docker compose up -d
name: kintsugi

services:
  app:
    image: ${KINTSUGI_REGISTRY:-registry.example.com/kintsugi}/kintsugi-app:${KINTSUGI_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kintsugi:${POSTGRES_PASSWORD}@postgres:5432/kintsugi
    ports:
      - "${KINTSUGI_HTTP_PORT:-8080}:8080"   # put the project's reverse proxy / TLS in front
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, jobs]                # jobs: runner → job gateway / KB tools

  worker:
    image: ${KINTSUGI_REGISTRY:-registry.example.com/kintsugi}/kintsugi-worker:${KINTSUGI_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kintsugi:${POSTGRES_PASSWORD}@postgres:5432/kintsugi
      DOCKER_HOST: tcp://docker-proxy:2375
      KINTSUGI_RUNNER_IMAGE: ${KINTSUGI_REGISTRY:-registry.example.com/kintsugi}/kintsugi-runner:${KINTSUGI_VERSION:-latest}
      KINTSUGI_JOBS_NETWORK: kintsugi_jobs
      KINTSUGI_JOBS_VOLUME: kintsugi_jobs-data   # per-job /src (ro) and /out via volume-subpath (Docker 26+)
    volumes:
      - git-cache:/var/lib/kintsugi/git          # clones of code + workspace repos
      - jobs-data:/var/lib/kintsugi/jobs
    depends_on:
      postgres: { condition: service_healthy }
      docker-proxy: { condition: service_started }
    networks: [backend]                          # needs outbound access to all configured Git servers

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kintsugi
      POSTGRES_USER: kintsugi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kintsugi"]
      interval: 5s
      retries: 20
    networks: [backend]

  # Limits the worker's Docker API access to container lifecycle (D32).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [backend]

  # The only internet path for runner containers; allowlist = configured LLM provider hosts (ADR-0009).
  egress-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    volumes:
      - ./egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./egress-proxy/allowlist.txt:/etc/squid/allowlist.txt:ro   # regenerated by the app on provider changes
    networks: [jobs, egress]

networks:
  backend: {}
  jobs:
    internal: true          # runner containers join this network only
  egress: {}

volumes:
  pg-data: {}
  git-cache: {}
  jobs-data: {}
