# Kintsugi — self-hosted package (ADR-0006).
# Usage: cp .env.example .env && docker compose up -d
name: kintsugi

services:
  app:
    image: ${KINTSUGI_REGISTRY:?set KINTSUGI_REGISTRY in .env}/kintsugi-app:${KINTSUGI_VERSION:?set KINTSUGI_VERSION in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kintsugi:${POSTGRES_PASSWORD}@postgres:5432/kintsugi
      KINTSUGI_DATA_DIR: /var/lib/kintsugi     # the API reads the document repo mirrors (read-only)
      KINTSUGI_PORTAL_DIR: /app/apps/portal/dist
      PORT: 3000
    ports:
      - "${KINTSUGI_HTTP_BIND:?set KINTSUGI_HTTP_BIND in .env}:${KINTSUGI_HTTP_PORT:?set KINTSUGI_HTTP_PORT in .env}:3000"   # use an SSH tunnel or a local reverse proxy with TLS
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 60s
    volumes:
      - kintsugi-data:/var/lib/kintsugi:ro   # API reads the worker's Git mirrors (ADR-0025)
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  # Runs Git sync, the document repo writer and runtime jobs in job workspaces under
  # /var/lib/kintsugi/jobs (ADR-0029: no Docker socket, no per-job container, no OS sandbox).
  # The image provides git 2.40+, Python 3.12 and Node 22 (standard libraries only) and runs
  # as a non-root user; memory and CPU limits here bound all jobs of this worker together.
  worker:
    image: ${KINTSUGI_REGISTRY:?set KINTSUGI_REGISTRY in .env}/kintsugi-worker:${KINTSUGI_VERSION:?set KINTSUGI_VERSION in .env}
    restart: unless-stopped
    # On a recreate the worker stops its jobs and records how their runs ended; Docker's default 10 s cuts that short.
    stop_grace_period: 60s
    env_file: .env
    environment:
      DATABASE_URL: postgres://kintsugi:${POSTGRES_PASSWORD}@postgres:5432/kintsugi
      KINTSUGI_DATA_DIR: /var/lib/kintsugi
    volumes:
      - kintsugi-data:/var/lib/kintsugi             # git mirrors, document repo worktrees, job workspaces (ADR-0025, ADR-0029)
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]                          # outbound: Git servers and the configured LLM providers
    # Job processes as a user of their own (ADR-0093), so a job cannot read the worker's environment (DATABASE_URL,
    # KINTSUGI_SECRET_KEY). Starting a process as another user needs the worker to run as root with SETUID/SETGID, kept to
    # the capabilities below. Off by default until it has been tried on a Linux host; to turn it on, uncomment:
    # user: "0:0"
    # cap_drop: [ALL]
    # cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE, KILL]
    # security_opt: ["no-new-privileges:true"]
    # and add to the worker's environment (the git variables let the root worker use the mirrors the non-root one made):
    #   KINTSUGI_JOB_UID: "10002"
    #   KINTSUGI_JOB_GID: "10002"
    #   GIT_CONFIG_COUNT: "1"
    #   GIT_CONFIG_KEY_0: safe.directory
    #   GIT_CONFIG_VALUE_0: "*"
    # and the same three GIT_CONFIG_* lines to the app's environment (it reads the mirrors the root worker makes).

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kintsugi
      POSTGRES_USER: kintsugi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kintsugi"]
      interval: 5s
      retries: 20
    networks: [backend]

networks:
  backend: {}

volumes:
  pg-data: {}
  # Backed by the admin-chosen host directory (ADR-0025).
  kintsugi-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${KINTSUGI_DATA_DIR:?set KINTSUGI_DATA_DIR in .env}
