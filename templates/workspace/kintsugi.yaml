# Project manifest — see docs/reference/workspace-repo.md
schemaVersion: 1

project:
  id: my-project            # TODO: stable id (kebab-case)
  name: My project          # TODO

rulebook:
  path: rulebook            # version lives only in rulebook/rulebook.yaml

defaults:
  packs: []                 # packs applied to every application, e.g. [org-baseline]

applications:
  - id: my-app              # TODO: one entry per application in scope
    disposition: refactor   # 7R: retire | retain | rehost | replatform | refactor | rearchitect | rebuild | repurchase
    pipeline: refactor      # id of a pipeline in rulebook/pipelines/
    packs: [main]           # packs for this application (after defaults.packs)
    repos:
      - server: my-git-server        # GitServer id registered in the installation
        path: org/my-app-legacy
        role: source                  # source repos are always read-only for the runtime
      - server: my-git-server
        path: org/my-app
        role: target                  # target base must be scaffolded before convert starts

autoCommitPaths:
  - units/**                # work item state, committed by kintsugi-bot (ADR-0012)
  - tasks/**
  - knowledge/**/generated/**

policy:
  harnesses: [copilot, claude-code, codex, chatgpt]   # any registered harness id
  requireCommitTrailer: true
