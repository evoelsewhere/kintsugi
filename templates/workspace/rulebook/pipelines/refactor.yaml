# Pipeline definition — see docs/reference/rulebook.md §5
# Copied from Kintsugi's built-in "refactor" template. Adapt stages, performers,
# required capabilities and gates to the project; add custom phases with a `category`.
id: refactor
appliesTo: {dispositions: [refactor, replatform]}

phases:
  - id: discover-assess
    stages:
      - {id: ingest, performer: {agent: knowledge-ingest}, requires: [understand]}
      - {id: assess, performer: {agent: assessment}, requires: [understand], gate: G1}

  - id: define-to-be
    stages:
      - {id: analyse, performer: {agent: to-be-analyst}}
      - {id: arb, performer: {member: [architect]}, gate: G2}

  - id: prepare-factory
    stages:
      - {id: rulebook-ready, performer: {member: [architect, ai-champion]}, gate: G3}

  - id: migrate
    perUnit: true
    stages:
      - {id: plan, performer: {agent: task-planner}, requires: [conventions, mapping, convert]}
      - {id: implement, performer: {member: [dev]}, requires: [convert]}
      - {id: review, performer: {agent: gate-reviewer}, requires: [review, conventions]}
      - {id: approve, performer: {member: [core-team]}, gate: G4}

  - id: verify
    perUnit: true
    stages:
      - {id: compare, performer: {runner: run-target, then: compare}, requires: [compare]}
      - {id: accept, performer: {member: [qc]}, gate: G5}

  - id: cutover
    stages:
      - {id: go-no-go, performer: {member: [pm, architect]}, requires: [cutover], gate: G6}

gates:
  G3: {require: [rulebook-ready]}
  G4: {require: [build, static-check, gate-reviewer, human-approval]}
