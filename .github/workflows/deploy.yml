name: Build and deploy Kintsugi

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kintsugi-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [app, worker]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kintsugi-${{ matrix.component }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kintsugi-${{ matrix.component }}:latest

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: publish
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      KINTSUGI_REMOTE_DIR: ${{ vars.KINTSUGI_REMOTE_DIR }}
      KINTSUGI_HTTP_BIND: ${{ vars.KINTSUGI_HTTP_BIND }}
      KINTSUGI_HTTP_PORT: ${{ vars.KINTSUGI_HTTP_PORT }}
      KINTSUGI_PUBLIC_URL: ${{ vars.KINTSUGI_PUBLIC_URL }}
      KINTSUGI_DATA_DIR: ${{ vars.KINTSUGI_DATA_DIR }}
      KINTSUGI_BOOTSTRAP_ADMIN_USER: ${{ vars.KINTSUGI_BOOTSTRAP_ADMIN_USER }}
      GHCR_USERNAME: ${{ github.repository_owner }}
      KINTSUGI_REGISTRY: ghcr.io/${{ github.repository_owner }}
      KINTSUGI_VERSION: sha-${{ github.sha }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment bundle
        uses: actions/checkout@v7

      - name: Validate connection settings and pin the host key
        shell: bash
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Add the SSH_HOST repository variable}"
          : "${SSH_USER:?Add the SSH_USER repository variable}"
          : "${KINTSUGI_REMOTE_DIR:?Add the KINTSUGI_REMOTE_DIR repository variable}"
          : "${SSH_PASSWORD:?Add the SSH_PASSWORD repository secret}"
          : "${SSH_KNOWN_HOSTS:?Add the SSH_KNOWN_HOSTS repository secret}"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "SSH_HOST has an invalid format" >&2; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "SSH_USER has an invalid format" >&2; exit 1; }
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "GHCR username has an invalid format" >&2; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] && (( SSH_PORT > 0 && SSH_PORT < 65536 )) || { echo "SSH_PORT must be between 1 and 65535" >&2; exit 1; }
          if [[ -n "$KINTSUGI_HTTP_PORT" ]]; then [[ "$KINTSUGI_HTTP_PORT" =~ ^[0-9]+$ ]] && (( KINTSUGI_HTTP_PORT > 0 && KINTSUGI_HTTP_PORT < 65536 )) || { echo "KINTSUGI_HTTP_PORT must be between 1 and 65535" >&2; exit 1; }; fi
          if [[ -n "$KINTSUGI_HTTP_BIND" && ! "$KINTSUGI_HTTP_BIND" =~ ^(127\.0\.0\.1|0\.0\.0\.0)$ ]]; then echo "KINTSUGI_HTTP_BIND must be 127.0.0.1 or 0.0.0.0" >&2; exit 1; fi
          if [[ -n "$KINTSUGI_PUBLIC_URL" && ! "$KINTSUGI_PUBLIC_URL" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$ ]]; then echo "KINTSUGI_PUBLIC_URL must be a plain http(s) URL without spaces or query parameters" >&2; exit 1; fi
          if [[ -n "$KINTSUGI_DATA_DIR" && ( ! "$KINTSUGI_DATA_DIR" =~ ^/[A-Za-z0-9._/-]+$ || "$KINTSUGI_DATA_DIR" == *..* ) ]]; then echo "KINTSUGI_DATA_DIR must be a normalized absolute path" >&2; exit 1; fi
          if [[ -n "$KINTSUGI_BOOTSTRAP_ADMIN_USER" && ! "$KINTSUGI_BOOTSTRAP_ADMIN_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then echo "KINTSUGI_BOOTSTRAP_ADMIN_USER has an invalid format" >&2; exit 1; fi
          [[ "$KINTSUGI_REMOTE_DIR" =~ ^/[A-Za-z0-9._/-]+$ && "$KINTSUGI_REMOTE_DIR" != *..* ]] || { echo "KINTSUGI_REMOTE_DIR must be a normalized absolute path" >&2; exit 1; }
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/kintsugi_known_hosts"
          chmod 600 "$RUNNER_TEMP/kintsugi_known_hosts"
          host_key_name="$SSH_HOST"
          if [[ "$SSH_PORT" != 22 ]]; then host_key_name="[$SSH_HOST]:$SSH_PORT"; fi
          if ! ssh-keygen -F "$host_key_name" -f "$RUNNER_TEMP/kintsugi_known_hosts" | grep -q ' ssh-ed25519 '; then
            echo "SSH_KNOWN_HOSTS must contain the full ED25519 host-key line for $host_key_name (not only its fingerprint)." >&2
            exit 1
          fi

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sshpass

      - name: Copy Compose bundle and prepare the remote installation
        shell: bash
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          KINTSUGI_SECRET_KEY: ${{ secrets.KINTSUGI_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KINTSUGI_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KINTSUGI_BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          known_hosts="$RUNNER_TEMP/kintsugi_known_hosts"
          ssh_args=(-p "$SSH_PORT" -o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          remote="$SSH_USER@$SSH_HOST"
          sshpass -e ssh "${ssh_args[@]}" "$remote" "mkdir -p -- '$KINTSUGI_REMOTE_DIR'"
          tar -C deploy/compose -czf - docker-compose.yml .env.example \
            | sshpass -e ssh "${ssh_args[@]}" "$remote" "tar -xzf - -C '$KINTSUGI_REMOTE_DIR'"
          {
            printf 'DEPLOY_KINTSUGI_PUBLIC_URL=%q\n' "$KINTSUGI_PUBLIC_URL"
            printf 'DEPLOY_KINTSUGI_HTTP_BIND=%q\n' "$KINTSUGI_HTTP_BIND"
            printf 'DEPLOY_KINTSUGI_HTTP_PORT=%q\n' "$KINTSUGI_HTTP_PORT"
            printf 'DEPLOY_KINTSUGI_DATA_DIR=%q\n' "$KINTSUGI_DATA_DIR"
            printf 'DEPLOY_KINTSUGI_BOOTSTRAP_ADMIN_USER=%q\n' "$KINTSUGI_BOOTSTRAP_ADMIN_USER"
            printf 'DEPLOY_KINTSUGI_SECRET_KEY=%q\n' "$KINTSUGI_SECRET_KEY"
            printf 'DEPLOY_POSTGRES_PASSWORD=%q\n' "$POSTGRES_PASSWORD"
            printf 'DEPLOY_KINTSUGI_BOOTSTRAP_ADMIN_PASSWORD=%q\n' "$KINTSUGI_BOOTSTRAP_ADMIN_PASSWORD"
            cat <<'REMOTE'
          set -euo pipefail
          install_dir="$1"
          registry="$2"
          version="$3"
          public_url="${DEPLOY_KINTSUGI_PUBLIC_URL:-}"
          http_bind="${DEPLOY_KINTSUGI_HTTP_BIND:-}"
          http_port="${DEPLOY_KINTSUGI_HTTP_PORT:-}"
          data_dir="${DEPLOY_KINTSUGI_DATA_DIR:-}"
          admin_user="${DEPLOY_KINTSUGI_BOOTSTRAP_ADMIN_USER:-}"
          secret_key="${DEPLOY_KINTSUGI_SECRET_KEY:-}"
          postgres_password="${DEPLOY_POSTGRES_PASSWORD:-}"
          admin_password="${DEPLOY_KINTSUGI_BOOTSTRAP_ADMIN_PASSWORD:-}"
          set_env() {
            key="$1"
            value="$2"
            escaped_value="${value//\\/\\\\}"
            escaped_value="${escaped_value//&/\\&}"
            escaped_value="${escaped_value//|/\\|}"
            if grep -q "^${key}=" "$install_dir/.env"; then
              sed -i "s|^${key}=.*|${key}=${escaped_value}|" "$install_dir/.env"
            else
              printf '%s=%s\n' "$key" "$value" >> "$install_dir/.env"
            fi
          }
          if [[ ! -f "$install_dir/.env" ]]; then
            cp "$install_dir/.env.example" "$install_dir/.env"
            [[ -n "$data_dir" ]] || data_dir="$install_dir/data"
            [[ -n "$secret_key" ]] || secret_key="$(openssl rand -base64 32 | tr -d '\n')"
            [[ -n "$postgres_password" ]] || postgres_password="$(openssl rand -hex 32)"
            [[ -n "$admin_password" ]] || admin_password="$(openssl rand -hex 24)"
            [[ "$secret_key" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] && [[ "$(printf '%s' "$secret_key" | base64 -d 2>/dev/null | wc -c)" -eq 32 ]] || { echo "KINTSUGI_SECRET_KEY must be a base64-encoded 32-byte key" >&2; exit 1; }
            [[ "$postgres_password" =~ ^[A-Fa-f0-9]{32,}$ ]] || { echo "POSTGRES_PASSWORD must be at least 32 hexadecimal characters" >&2; exit 1; }
            [[ "$admin_password" =~ ^[A-Za-z0-9._-]{8,}$ ]] || { echo "KINTSUGI_BOOTSTRAP_ADMIN_PASSWORD must be at least 8 letters, digits, dots, underscores, or hyphens" >&2; exit 1; }
            [[ -n "$public_url" ]] && set_env KINTSUGI_PUBLIC_URL "$public_url"
            [[ -n "$http_bind" ]] && set_env KINTSUGI_HTTP_BIND "$http_bind"
            [[ -n "$http_port" ]] && set_env KINTSUGI_HTTP_PORT "$http_port"
            [[ -n "$admin_user" ]] && set_env KINTSUGI_BOOTSTRAP_ADMIN_USER "$admin_user"
            set_env KINTSUGI_DATA_DIR "$data_dir"
            set_env KINTSUGI_SECRET_KEY "$secret_key"
            set_env POSTGRES_PASSWORD "$postgres_password"
            set_env KINTSUGI_BOOTSTRAP_ADMIN_PASSWORD "$admin_password"
            chmod 600 "$install_dir/.env"
          else
            [[ -n "$public_url" ]] && set_env KINTSUGI_PUBLIC_URL "$public_url"
            [[ -n "$http_bind" ]] && set_env KINTSUGI_HTTP_BIND "$http_bind"
            [[ -n "$http_port" ]] && set_env KINTSUGI_HTTP_PORT "$http_port"
          fi
          for key in KINTSUGI_PUBLIC_URL KINTSUGI_SECRET_KEY POSTGRES_PASSWORD KINTSUGI_BOOTSTRAP_ADMIN_PASSWORD KINTSUGI_DATA_DIR; do
            if ! grep -Eq "^${key}=.+$" "$install_dir/.env"; then
              echo "Set $key in $install_dir/.env before deploying." >&2
              exit 1
            fi
          done
          data_dir="$(sed -n 's/^KINTSUGI_DATA_DIR=//p' "$install_dir/.env" | head -n 1)"
          [[ "$data_dir" =~ ^/[A-Za-z0-9._/-]+$ && "$data_dir" != *..* && "$data_dir" != / ]] || { echo "KINTSUGI_DATA_DIR must be a normalized absolute path" >&2; exit 1; }
          mkdir -p "$data_dir"
          if [[ ! -f "$install_dir/.data-dir-owner-set" ]]; then
            if [[ "$(stat -c '%u:%g' "$data_dir")" != 10001:10001 ]]; then
              if ! sudo -n chown 10001:10001 "$data_dir"; then
                echo "Cannot prepare the worker data directory. Run: sudo chown 10001:10001 '$data_dir'" >&2
                exit 1
              fi
            fi
            touch "$install_dir/.data-dir-owner-set"
          fi
          set_env KINTSUGI_REGISTRY "$registry"
          set_env KINTSUGI_VERSION "$version"
          chmod 600 "$install_dir/.env"
          docker version >/dev/null
          docker compose version >/dev/null
          docker compose --env-file "$install_dir/.env" -f "$install_dir/docker-compose.yml" config --quiet
          REMOTE
          } | sshpass -e ssh "${ssh_args[@]}" "$remote" bash -s -- "$KINTSUGI_REMOTE_DIR" "$KINTSUGI_REGISTRY" "$KINTSUGI_VERSION"

      - name: Make room for the new images
        shell: bash
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          MIN_FREE_GB: ${{ vars.KINTSUGI_MIN_FREE_GB || '5' }}
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$MIN_FREE_GB" =~ ^[0-9]+$ ]] || { echo "KINTSUGI_MIN_FREE_GB must be a whole number of GiB" >&2; exit 1; }
          known_hosts="$RUNNER_TEMP/kintsugi_known_hosts"
          ssh_args=(-p "$SSH_PORT" -o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          remote="$SSH_USER@$SSH_HOST"
          # Every deploy pulls new SHA-tagged images and the previous ones stay on the host. Pulling into a full disk fails
          # halfway through a layer, so check first: below the minimum, remove the Kintsugi images no container uses (the
          # label is the one the build sets) and check again; still short, stop here with the numbers.
          sshpass -e ssh "${ssh_args[@]}" "$remote" bash -s -- "$MIN_FREE_GB" "org.opencontainers.image.source=$IMAGE_SOURCE" <<'REMOTE'
          set -euo pipefail
          min_kb=$(( $1 * 1024 * 1024 ))
          label="$2"
          roots=("$(docker info --format '{{.DockerRootDir}}')")
          if [[ -d /var/lib/containerd ]]; then roots+=(/var/lib/containerd); fi
          free_kb() {
            local least="" value root
            for root in "${roots[@]}"; do
              value="$(df -Pk "$root" | awk 'NR==2 { print $4 }')"
              if [[ -z "$least" || "$value" -lt "$least" ]]; then least="$value"; fi
            done
            echo "$least"
          }
          echo "Free on ${roots[*]}: $(( $(free_kb) / 1024 / 1024 )) GiB (need $1)"
          if (( $(free_kb) < min_kb )); then
            echo "Low on disk: removing Kintsugi images that no container uses"
            docker image prune -af --filter "label=$label" || true
            echo "Free now: $(( $(free_kb) / 1024 / 1024 )) GiB"
          fi
          if (( $(free_kb) < min_kb )); then
            echo "Less than $1 GiB free after cleaning the old images. Free space on the host before deploying (docker system df shows what Docker holds)." >&2
            docker system df >&2 || true
            exit 1
          fi
          REMOTE

      - name: Pull and restart the Compose stack
        shell: bash
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          GHCR_PULL_TOKEN: ${{ github.token }}
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          known_hosts="$RUNNER_TEMP/kintsugi_known_hosts"
          ssh_args=(-p "$SSH_PORT" -o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          remote="$SSH_USER@$SSH_HOST"
          auth_dir="$KINTSUGI_REMOTE_DIR/.ghcr-auth-$GITHUB_RUN_ID"
          cleanup() {
            sshpass -e ssh "${ssh_args[@]}" "$remote" "docker --config '$auth_dir' logout ghcr.io >/dev/null 2>&1 || true; rm -f -- '$auth_dir/config.json'; rmdir -- '$auth_dir' 2>/dev/null || true" || true
          }
          trap cleanup EXIT
          sshpass -e ssh "${ssh_args[@]}" "$remote" "mkdir -m 700 -- '$auth_dir'"
          printf '%s' "$GHCR_PULL_TOKEN" \
            | sshpass -e ssh "${ssh_args[@]}" "$remote" "docker --config '$auth_dir' login ghcr.io --username '$GHCR_USERNAME' --password-stdin" >/dev/null
          sshpass -e ssh "${ssh_args[@]}" "$remote" "cd '$KINTSUGI_REMOTE_DIR' && DOCKER_CONFIG='$auth_dir' docker compose pull && DOCKER_CONFIG='$auth_dir' docker compose up -d --remove-orphans --wait --wait-timeout 180 && docker compose ps"
          # The stack runs on the new images: the ones it replaced are unused now. Old versions can be pulled again by tag,
          # so they are not worth the disk. A failed cleanup never fails the deploy.
          sshpass -e ssh "${ssh_args[@]}" "$remote" "docker image prune -af --filter 'label=org.opencontainers.image.source=$IMAGE_SOURCE'" || echo "Could not remove the old images; the next deploy retries"
