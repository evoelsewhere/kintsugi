name: Coding Agent Workflow checks

on:
  push:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/portal/**"
      - "packages/**"
      - "services/orchestrator/**"
      - "services/harness-hub/**"
      - "scripts/**"
      - "test/coding-agent-workflow/**"
      - ".github/workflows/coding-agent-workflow-checks.yml"
      - "docs/guides/coding-agent-workflow.md"
      - "docs/guides/coding-agent-workflow-quickstart.html"
      - "docs/reference/coding-agent-*.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"

permissions:
  contents: read

jobs:
  contracts:
    name: ${{ matrix.os }} contracts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @kintsugi/portal test
      - run: pnpm --filter @kintsugi/cli test
      - run: pnpm --filter @kintsugi/kintsugi-client test
      - run: pnpm --filter @kintsugi/harness-hub test
      - run: pnpm run test:coding-agent:runner

  required-database-integrations:
    name: Required API and worker database integrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KINTSUGI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kintsugi_test_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@kintsugi/api --filter=@kintsugi/orchestrator
      - run: pnpm run test:coding-agent:runner
      - run: pnpm run test:coding-agent:integration
      - run: pnpm run test:coding-agent:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coding-agent-workflow-db-reports
          path: .tmp/coding-agent-workflow/*.json
          if-no-files-found: ignore
