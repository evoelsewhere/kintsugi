name: Deploy static landing page

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/build-site.mjs'
      - 'deploy/compose/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter kintsugi

      - name: Build landing page and documentation
        run: pnpm site:build

      - name: Upload landing page
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
